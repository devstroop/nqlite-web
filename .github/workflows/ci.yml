name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # vendor/react-uikit is the alias target

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: format
        run: npm run format:check

      - name: build
        run: npm run build

      # Validates wrangler.jsonc + the worker bundle without auth/upload.
      - name: wrangler dry-run
        run: npm run deploy:dry
